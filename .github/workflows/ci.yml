name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
        env:
          VITE_AUTH_MODE: local
      - run: node scripts/generate-seed.mjs && git diff --exit-code -- supabase/seed.sql
      - run: git diff --check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
          retention-days: 3
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - run: for file in supabase/migrations/*.sql; do psql -v ON_ERROR_STOP=1 -f "$file"; done
      - run: psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/seed.sql
      - run: |
          for file in supabase/tests/*.sql; do
            [ "$file" = supabase/tests/bootstrap.sql ] || psql -v ON_ERROR_STOP=1 -f "$file"
          done
