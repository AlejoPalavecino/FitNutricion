name: Remediation baseline
on:
  push:
    branches: ['improvements/stage-2-reliable-sync']
    paths: ['.github/workflows/review-bootstrap.yml']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Package reproducible validation workspace (no credentials)
        if: always()
        run: tar --exclude=.git --exclude=validation-workspace.tar.gz -czf /tmp/validation-workspace.tar.gz . && mv /tmp/validation-workspace.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: remediation-validation-workspace
          path: validation-workspace.tar.gz
          retention-days: 1
